name: Android debug APK (emulator)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze 2>&1 | tee analyze.txt
        continue-on-error: true
      - name: Test
        run: flutter test 2>&1 | tee test.txt
        continue-on-error: true
      - name: Build debug APK (x86_64 emulator)
        run: set -o pipefail; flutter build apk --debug --target-platform android-x64 2>&1 | tee build.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tarraf-clinic-emulator
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            analyze.txt
            test.txt
            build.txt
      - name: Publish report branch
        if: always()
        run: |
          mkdir -p /tmp/rep && cp analyze.txt test.txt build.txt /tmp/rep/ 2>/dev/null || true
          cd /tmp/rep && git init -q -b ci-report && git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "CI report ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-report
      - name: Release APK
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp build/app/outputs/flutter-apk/app-debug.apk tarraf_clinic_emulator.apk
          gh release create "emulator-${{ github.run_number }}" tarraf_clinic_emulator.apk --title "Emulator build ${{ github.run_number }}" --notes "Debug APK (x86_64) for the Android emulator. Commit ${{ github.sha }}"
