name: tarraf_clinic
description: Private offline clinical workspace for Dr. Ahmad Tarraf
publish_to: none
version: 0.4.0+4
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.4.2
  sqflite_common: ^2.5.6
  sqflite_sqlcipher: 3.4.1
  provider: ^6.1.2
  flutter_svg: ^2.2.1
  path: ^1.9.1
  path_provider: ^2.1.5
  cryptography: ^2.7.0
  flutter_secure_storage: ^9.2.4
  local_auth: 3.0.1
  image_picker: ^1.1.2
  file_picker: ^10.3.3
  share_plus: ^11.1.0
  pdf: ^3.11.3
  printing: ^5.14.2
  flutter_local_notifications: ^19.4.2
  timezone: ^0.10.1
  signature: ^6.3.0
  uuid: ^4.5.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.6
flutter:
  uses-material-design: true
  assets:
    - assets/brand_reference.png
    - assets/anatomy/
    - assets/phoenix.svg
    - assets/brand_icon.png
    - assets/Tajawal.ttf
    - assets/Arabic.ttf
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/Tajawal.ttf
    - family: Clinic
      fonts:
        - asset: assets/Arabic.ttf

dependency_overrides:
  image: 4.5.4
