name: Android debug APK (emulator)
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze 2>&1 | tee analyze.txt
        continue-on-error: true
      - name: Test
        run: flutter test 2>&1 | tee test.txt
        continue-on-error: true
      - name: Build debug APK (x86_64 emulator)
        run: flutter build apk --debug --target-platform android-x64 2>&1 | tee build.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tarraf-clinic-emulator
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            analyze.txt
            test.txt
            build.txt
